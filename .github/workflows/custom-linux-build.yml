name: Custom Linux Build

# Builds this fork for Linux without the upstream project's private release secrets:
#   * Ubuntu / Debian:  Nuvio-Linux-x86_64-<version>.deb          (Ubuntu 24.04 or newer)
#   * Arch Linux:       nuvio-fork-bin-<version>-1-x86_64.pkg.tar.zst
# Each is installed and started on a virtual display before it is published. Local (offline)
# accounts work fully; Nuvio cloud sign-in, Trakt and MDBList integrations are unavailable in
# these builds, as in the custom Windows build.

on:
  push:
    branches:
      - "custom/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux x64 (deb + Arch package)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install build and test dependencies
        shell: bash
        run: |
          bash ./scripts/linux/install-desktop-build-dependencies.sh \
            fakeroot openbox imagemagick xdotool x11-utils x11-apps \
            libmpv2 gstreamer1.0-plugins-good gstreamer1.0-libav glib-networking \
            libgl1-mesa-dri dbus-x11 xdg-utils

      - name: Version
        shell: bash
        run: |
          # The same version line as the Windows fork builds (0.1.1000+run).
          echo "NUVIO_DESKTOP_VERSION_NAME=0.1.$((1000 + GITHUB_RUN_NUMBER))-fork" >> "$GITHUB_ENV"
          echo "FORK_VERSION=0.1.$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Interface host smoke test
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1440x900x24" \
            bash ./scripts/linux/custom/smoke-shell-host.sh "$RUNNER_TEMP/smoke-host"

      - name: Write placeholder runtime config
        shell: bash
        run: |
          # Placeholders keep client construction valid. Offline/local accounts never contact
          # these endpoints.
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://offline.invalid' \
            'NUVIO_SUPABASE_ANON_KEY=offline-build' > local.properties

      - name: Build DEB
        shell: bash
        run: |
          set -o pipefail
          ./gradlew \
            :composeApp:packageReleaseDeb \
            -Pcompose.desktop.packaging.checkJdkVendor=false \
            --no-configuration-cache \
            --no-daemon \
            --stacktrace 2>&1 | tee build-output.log

      # Job logs live on storage that some viewers cannot reach; surface compiler errors as
      # annotations so they show up in the run summary and the checks API.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          [ -f build-output.log ] || exit 0
          lines="$(grep -E '^e: |error:|undefined reference' build-output.log | head -n 10)"
          [ -n "$lines" ] || lines="$(grep -E 'What went wrong|^\s*> |Exception:|FAIL' build-output.log | head -n 10)"
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::${line:0:900}"
          done <<< "$lines"
          exit 0

      - name: Collect DEB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages
          deb="$(find composeApp/build/compose/binaries -name '*.deb' | head -n 1)"
          test -n "$deb"
          cp "$deb" "artifacts/packages/Nuvio-Linux-x86_64-${NUVIO_DESKTOP_VERSION_NAME}.deb"
          dpkg-deb -I "$deb" | sed -n 1,25p
          dpkg-deb -c "$deb" | awk '{print $6}' | grep -vE '/lib/runtime/|/lib/app/.*\.jar$' | head -n 40

      - name: Install the DEB and start the app on a virtual display
        shell: bash
        run: |
          set -uo pipefail
          sudo apt-get install --yes "./artifacts/packages/Nuvio-Linux-x86_64-${NUVIO_DESKTOP_VERSION_NAME}.deb"
          cat > run-app.sh <<'EOF'
          set -uo pipefail
          export HOME="$(mktemp -d)"
          (openbox >/dev/null 2>&1 &)
          sleep 1
          /opt/nuvio/bin/Nuvio > app.log 2>&1 &
          pid=$!
          sleep 40
          alive=0; kill -0 "$pid" 2>/dev/null && alive=1
          width="$(xwininfo -root -tree | grep -E '"Nuvio": \("com-nuvio-app-MainKt"' | sed -E 's/.*\)[[:space:]]+([0-9]+)x[0-9]+.*/\1/' | head -n 1)"
          kill "$pid" 2>/dev/null; sleep 2; kill -9 "$pid" 2>/dev/null
          echo "app running after 40s: $alive, window width ${width:-none}"
          # Running, and its window is really on screen (not the 1x1 placeholder of a stuck start).
          [ "$alive" = 1 ] && [ "${width:-0}" -ge 400 ] 2>/dev/null
          EOF
          status=0
          # dbus-run-session: a desktop always has a session bus, and without one the app's
          # system-theme lookup never returns.
          xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- bash run-app.sh || status=$?
          if [ "$status" != 0 ]; then echo "::error::The installed app did not come up."; tail -n 40 app.log || true; fi
          exit $status

      - name: Build and verify the Arch Linux package
        shell: bash
        run: |
          bash ./scripts/linux/custom/build-arch-package.sh \
            "artifacts/packages/Nuvio-Linux-x86_64-${NUVIO_DESKTOP_VERSION_NAME}.deb" \
            "${FORK_VERSION}" artifacts/arch
          cp artifacts/arch/*.pkg.tar.zst artifacts/packages/

      - name: Write install instructions
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/packages
          deb="Nuvio-Linux-x86_64-${NUVIO_DESKTOP_VERSION_NAME}.deb"
          arch="$(cd artifacts/packages && ls *.pkg.tar.zst 2>/dev/null | head -n 1 || true)"
          arch="${arch:-nuvio-fork-bin-${FORK_VERSION}-1-x86_64.pkg.tar.zst}"
          cat > artifacts/packages/INSTALL-LINUX.txt <<EOF
          Nuvio for Linux (fork build ${NUVIO_DESKTOP_VERSION_NAME})
          ==========================================================

          UBUNTU 24.04 or newer

            Install:    sudo apt install ./${deb}
            Start:      "Nuvio" in the app menu, or:  /opt/nuvio/bin/Nuvio
            Remove:     sudo apt remove nuvio

          ARCH LINUX

            Install:    sudo pacman -U ${arch}
            Start:      "Nuvio" in the app menu, or:  nuvio
            Remove:     sudo pacman -R nuvio-fork-bin

          Run the install command in the folder where the file is. It pulls in what
          the app needs by itself (mpv, WebKitGTK, GStreamer plugins).

          FIRST START

            1. Choose "Continue Without Account". Everything is stored on this computer only.
            2. Create a profile when asked.
            3. Add your addons under Settings > Addons.

          IF SOMETHING IS WRONG

            The window is black, blank or flickers:
                NUVIO_SHELL_RENDER=software nuvio
            (The app already does this by itself on NVIDIA's driver. On AMD and
            Intel it draws with the graphics card.)
            Go back to the old interface:
                NUVIO_CLASSIC_UI=1 nuvio
            (On Ubuntu write /opt/nuvio/bin/Nuvio instead of nuvio.)

            On Wayland the app runs through XWayland, which every major desktop
            (GNOME, KDE Plasma) has by default.

          Not in these builds: Nuvio cloud sign-in, Trakt and MDBList.
          EOF
          {
            echo "## Install on Linux"
            echo
            echo "Download the package for your system from **Artifacts** at the bottom of this page, unzip it, open a terminal in that folder and run the command."
            echo
            echo "### Ubuntu 24.04 or newer"
            echo "Artifact: \`nuvio-custom-linux-ubuntu-deb\`"
            echo '```'
            echo "sudo apt install ./${deb}"
            echo '```'
            echo "Start it from the app menu (\"Nuvio\") or with \`/opt/nuvio/bin/Nuvio\`. Remove it with \`sudo apt remove nuvio\`."
            echo
            echo "### Arch Linux"
            echo "Artifact: \`nuvio-custom-linux-arch-pkg\`"
            echo '```'
            echo "sudo pacman -U ${arch}"
            echo '```'
            echo "Start it from the app menu (\"Nuvio\") or with \`nuvio\`. Remove it with \`sudo pacman -R nuvio-fork-bin\`."
            echo
            echo "### First start"
            echo "1. Choose **Continue Without Account**. Everything is stored on this computer only."
            echo "2. Create a profile when asked."
            echo "3. Add your addons under Settings › Addons."
            echo
            echo "### If something is wrong"
            echo "| Problem | Start it like this |"
            echo "|---|---|"
            echo "| Window is black, blank or flickers | \`NUVIO_SHELL_RENDER=software nuvio\` |"
            echo "| Want the old interface back | \`NUVIO_CLASSIC_UI=1 nuvio\` |"
            echo
            echo "The app picks how to draw by graphics driver: on NVIDIA's driver it paints without the graphics card (their driver shows a black window otherwise), on AMD and Intel it uses the card."
            echo
            echo "On Ubuntu write \`/opt/nuvio/bin/Nuvio\` instead of \`nuvio\`. The same instructions are in \`INSTALL-LINUX.txt\` inside each download."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Ubuntu package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-custom-linux-ubuntu-deb
          path: |
            artifacts/packages/*.deb
            artifacts/packages/INSTALL-LINUX.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Arch package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-custom-linux-arch-pkg
          path: |
            artifacts/packages/*.pkg.tar.zst
            artifacts/packages/INSTALL-LINUX.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Check the packages carry no account names
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          set +e
          # The finished package, unpacked all the way down (jars included), searched for the
          # account this was built under. Nothing in it should name who built it.
          work="$(mktemp -d)"
          dpkg-deb -x artifacts/packages/*.deb "$work/deb"
          mkdir "$work/jars"
          find "$work/deb" -name '*.jar' | while read -r jar; do
            unzip -q -o "$jar" -d "$work/jars/$(basename "$jar")" 2>/dev/null || true
          done
          hits=0
          for name in "$OWNER" "$ACTOR" "${OWNER%-code}"; do
            [ -n "$name" ] || continue
            found="$(grep -r -a -i -l -F -- "$name" "$work/deb" "$work/jars" 2>/dev/null | grep -v '\.jar$' | head -n 5)"
            if [ -n "$found" ]; then echo "::error::account name found in the package"; echo "$found"; hits=1; fi
          done
          emails="$(grep -r -a -h -o -E '[A-Za-z0-9._%+-]+@(gmail|outlook|hotmail|yahoo|icloud|proton)[a-z.]*' "$work/deb" "$work/jars" 2>/dev/null | sort -u | head -n 10)"
          # Open-source libraries inside the app credit their authors by email in their licence
          # notices; those are listed for the record and are not a failure.
          if [ -n "$emails" ]; then echo "Email addresses in bundled libraries' credits (library authors):"; echo "$emails"; fi
          [ "$hits" = 0 ] && echo "The account this was built under is not named anywhere in the package."
          exit $hits
