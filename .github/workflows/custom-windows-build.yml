name: Custom Windows Build

# Builds a personal Windows MSI of this fork without the upstream project's
# private release secrets (Supabase, Trakt, MDBList, Sentry, signing).
# Local (offline) accounts work fully; Nuvio cloud sign-in, Trakt and MDBList
# integrations are unavailable in these builds.

on:
  push:
    branches:
      - "custom/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custom-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 MSI
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Fetch Windows runtime (Git LFS)
        shell: bash
        run: |
          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          runtime_path="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          runtime_size="$(wc -c < "${runtime_path}" 2>/dev/null || echo 0)"
          if (( runtime_size < 1000000 )); then
            echo "libmpv-2.dll was not materialized from Git LFS (size ${runtime_size})." >&2
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write placeholder runtime config
        shell: bash
        run: |
          # Placeholders keep client construction valid. Offline/local accounts
          # never contact these endpoints.
          cat > local.properties <<'EOF'
          NUVIO_SUPABASE_URL=https://offline.invalid
          NUVIO_SUPABASE_ANON_KEY=offline-build
          EOF
          sed -i 's/^[[:space:]]*//' local.properties

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload -NonInteractive -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-custom-windows-x64
          path: composeApp/build/compose/release-msis/*.msi
          if-no-files-found: error
          retention-days: 30
