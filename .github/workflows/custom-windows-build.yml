name: Custom Windows Build

# Builds a personal Windows MSI of this fork without the upstream project's
# private release secrets (Supabase, Trakt, MDBList, Sentry, signing).
# Local (offline) accounts work fully; Nuvio cloud sign-in, Trakt and MDBList
# integrations are unavailable in these builds.

on:
  push:
    branches:
      - "custom/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: custom-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 MSI
    runs-on: windows-2022
    env:
      WEBVIEW2_VERSION: 1.0.4078.44
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Read the Windows runtime pointer
        id: runtime
        shell: bash
        run: |
          pointer="composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll"
          echo "oid=$(sed -n 's/^oid sha256://p' "${pointer}" | tr -d '\r')" >> "$GITHUB_OUTPUT"
          echo "size=$(sed -n 's/^size //p' "${pointer}" | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Restore the Windows runtime from the cache
        id: runtime-cache
        uses: actions/cache/restore@v5
        with:
          path: composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll
          key: windows-libmpv-${{ steps.runtime.outputs.oid }}

      - name: Fetch Windows runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_OID: ${{ steps.runtime.outputs.oid }}
          RUNTIME_SIZE: ${{ steps.runtime.outputs.size }}
        run: |
          # libmpv-2.dll is a Git LFS file, and LFS downloads are metered. It is taken, in
          # order, from the cache, from LFS, then out of an earlier build of this workflow.
          # Whatever the source, only the exact file the repository names (by SHA-256) is used.
          $ErrorActionPreference = 'Continue'
          $target = 'composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll'
          $oid = $env:RUNTIME_OID
          $size = [int64]$env:RUNTIME_SIZE
          if (-not $oid -or $size -le 0) { Write-Error 'The runtime pointer could not be read.'; exit 1 }

          function Test-Runtime([string]$path) {
            if (-not (Test-Path -LiteralPath $path)) { return $false }
            if ((Get-Item -LiteralPath $path).Length -ne $size) { return $false }
            return ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower() -eq $oid)
          }

          if (Test-Runtime $target) { Write-Host 'Runtime: from the cache.'; exit 0 }

          git lfs pull --include="composeApp/src/desktopMain/native/windows/runtime/**" --exclude=""
          if (Test-Runtime $target) { Write-Host 'Runtime: from Git LFS.'; exit 0 }
          Write-Host 'Git LFS did not deliver the runtime; looking in earlier builds.'

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $work = Join-Path $env:RUNNER_TEMP 'runtime-fallback'
          $picked = Join-Path $env:RUNNER_TEMP 'runtime-picked'
          New-Item -ItemType Directory -Force $work, $picked | Out-Null

          function Expand-Msi([string]$msi, [string]$dest) {
            New-Item -ItemType Directory -Force $dest | Out-Null
            $p = Start-Process msiexec.exe -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$dest`"" -Wait -PassThru
            if ($p.ExitCode -eq 0) { return }
            Write-Host "msiexec gave $($p.ExitCode); unpacking with 7-Zip instead."
            & 7z x $msi "-o$dest" -y | Out-Null
            foreach ($cab in @(Get-ChildItem $dest -Recurse -File -Filter *.cab)) {
              & 7z x $cab.FullName "-o$($cab.FullName).files" -y | Out-Null
            }
          }

          # The file itself, or the same file packed inside the app's jar.
          function Find-Runtime([string]$root) {
            foreach ($file in @(Get-ChildItem $root -Recurse -File -ErrorAction SilentlyContinue)) {
              if ($file.Length -eq $size -and (Test-Runtime $file.FullName)) { return $file.FullName }
              if ($file.Length -lt 5MB) { continue }
              $zip = $null
              try {
                $zip = [System.IO.Compression.ZipFile]::OpenRead($file.FullName)
                $entry = $zip.Entries | Where-Object { $_.FullName -eq 'native/windows/libmpv-2.dll' } | Select-Object -First 1
                if ($entry) {
                  $out = Join-Path $picked 'libmpv-2.dll'
                  [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $out, $true)
                  if (Test-Runtime $out) { return $out }
                }
              } catch {
              } finally {
                if ($zip) { $zip.Dispose() }
              }
            }
            return $null
          }

          function Search-Installers([string]$dir) {
            $n = 0
            foreach ($msi in @(Get-ChildItem $dir -Recurse -File -Filter *.msi -ErrorAction SilentlyContinue)) {
              $n++
              $out = Join-Path $dir "unpacked-$n"
              Expand-Msi $msi.FullName $out
              $hit = Find-Runtime $out
              if ($hit) { return $hit }
            }
            return $null
          }

          $found = $null
          $runs = @(gh run list --repo $env:GITHUB_REPOSITORY --workflow custom-windows-build.yml --status success --limit 6 --json databaseId --jq '.[].databaseId')
          foreach ($run in $runs) {
            if (-not $run) { continue }
            $dir = Join-Path $work "run-$run"
            gh run download $run --repo $env:GITHUB_REPOSITORY --name nuvio-custom-windows-x64 --dir $dir
            if ($LASTEXITCODE -ne 0) { continue }
            $found = Search-Installers $dir
            if ($found) { Write-Host "Runtime: from the installer built by run $run."; break }
          }

          if (-not $found) {
            Write-Error 'libmpv-2.dll could not be fetched: Git LFS is over its budget and no earlier build holds the same file.'
            exit 1
          }
          Copy-Item -LiteralPath $found -Destination $target -Force
          if (-not (Test-Runtime $target)) { Write-Error 'The recovered runtime does not match the repository.'; exit 1 }
          exit 0

      - name: Keep the Windows runtime in the cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: composeApp/src/desktopMain/native/windows/runtime/libmpv-2.dll
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write placeholder runtime config
        shell: bash
        run: |
          # Placeholders keep client construction valid. Offline/local accounts
          # never contact these endpoints.
          cat > local.properties <<'EOF'
          NUVIO_SUPABASE_URL=https://offline.invalid
          NUVIO_SUPABASE_ANON_KEY=offline-build
          INTRODB_API_URL=https://api.introdb.app
          EOF
          sed -i 's/^[[:space:]]*//' local.properties

      - name: Fetch wireproxy (optional built-in WARP)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Optional: without it the app simply offers no WARP mode.
          set +e
          dest="$GITHUB_WORKSPACE/composeApp/src/desktopMain/resources/net"
          work="$RUNNER_TEMP/wireproxy"
          mkdir -p "$dest" "$work"
          url="$(gh api repos/whyvl/wireproxy/releases/latest --jq '.assets[] | select(.name | test("windows"; "i")) | select(.name | test("amd64|x86_64"; "i")) | .browser_download_url' | head -n1)"
          echo "wireproxy asset: ${url:-none}"
          if [ -z "$url" ]; then echo "::warning::wireproxy release not found; WARP mode will be unavailable"; exit 0; fi
          curl -fsSL "$url" -o "$work/pkg" || { echo "::warning::wireproxy download failed"; exit 0; }
          cd "$work"
          case "$url" in
            *.zip) unzip -o -q pkg ;;
            *.tar.gz|*.tgz) tar -xzf pkg ;;
            *.exe) cp pkg wireproxy.exe ;;
          esac
          exe="$(find . -iname 'wireproxy*.exe' | head -n1)"
          if [ -z "$exe" ]; then echo "::warning::no wireproxy.exe in the package"; exit 0; fi
          cp "$exe" "$dest/wireproxy.exe"
          ls -la "$dest"

      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 `
            -Version $env:WEBVIEW2_VERSION `
            -OutputDirectory "$env:RUNNER_TEMP\nuget" `
            -DirectDownload -NonInteractive -NoCache
          $webView2Root = Join-Path $env:RUNNER_TEMP "nuget\Microsoft.Web.WebView2.$env:WEBVIEW2_VERSION"
          "WEBVIEW2_ROOT=$webView2Root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          # Fork builds get their own version line (0.1.1000+run) so the MSI upgrades an
          # installed official 0.1.x build in place and official updates never look newer.
          $env:NUVIO_DESKTOP_VERSION_NAME = "0.1.$(1000 + [int]$env:GITHUB_RUN_NUMBER)-fork"
          Write-Output "Version: $env:NUVIO_DESKTOP_VERSION_NAME"
          & .\gradlew.bat `
            :composeApp:packageReleaseMsi `
            "-Pnuvio.webview2.dir=$env:WEBVIEW2_ROOT" `
            "-Pcompose.desktop.packaging.checkJdkVendor=false" `
            --no-configuration-cache `
            --no-daemon `
            --stacktrace 2>&1 | Tee-Object -FilePath build-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Job logs live on storage that some viewers cannot reach; surface compiler errors as
      # annotations so they show up in the run summary and the checks API.
      - name: Report build errors
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path build-output.log)) { exit 0 }
          # GitHub keeps at most 10 error annotations per step, so compiler errors go first.
          $log = Get-Content build-output.log
          $lines = @($log | Where-Object { $_ -match '^e: |error C\d+|error LNK' })
          if ($lines.Count -eq 0) {
            $lines = @($log | Where-Object { $_ -match 'What went wrong|^\s*> |Exception:' })
          }
          $lines | Select-Object -First 10 | ForEach-Object {
            $msg = ($_ -replace '%', '%25' -replace "`r", '' -replace "`n", ' ').Trim()
            if ($msg.Length -gt 900) { $msg = $msg.Substring(0, 900) }
            Write-Output "::error::$msg"
          }

      - name: Upload MSI
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-custom-windows-x64
          path: composeApp/build/compose/release-msis/*.msi
          if-no-files-found: error
          retention-days: 30
